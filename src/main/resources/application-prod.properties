spring.datasource.url=jdbc:postgresql://localhost:5432/football_prod
spring.datasource.username=football_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Firebase Cloud Messaging (sur les propriétés de base)
app.fcm.enabled=${APP_FCM_ENABLED:false}
app.fcm.service-account-path=${APP_FCM_SERVICE_ACCOUNT_PATH:}
app.fcm.project-id=${APP_FCM_PROJECT_ID:}