spring.application.name=football-api
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/football
spring.datasource.username=admin
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.root=INFO
logging.level.com.fscore.app=DEBUG

# Security
app.security.jwt-secret=football-api-change-this-secret-in-production-0123456789abcdef
app.security.jwt-expiration-ms=28800000
app.admin.email=admin@football.com
app.admin.password=admin123
app.admin.name=Administrator

# Firebase Cloud Messaging
app.fcm.enabled=false
# Chemin (classpath ou filesystem) vers le service account. Voir firebase-service-account.json.example.
# Vide ou absent => fallback sur GoogleCredentials.getApplicationDefault()
app.fcm.service-account-path=firebase-service-account.json
app.fcm.project-id=
# Note: les notifications web push (service worker + getToken) exigent un contexte sécurisé (HTTPS),
# sauf sur localhost.

# Stockage de fichiers (images/vidéos)
# Dossier racine sur le disque (hors classpath). Les fichiers sont servis via /uploads/**
app.storage.location=./data/uploads
# Taille max par type (octets)
app.storage.max-image-size=10485760
app.storage.max-video-size=209715200

# Limites multipart (Spring)
spring.servlet.multipart.max-file-size=210MB
spring.servlet.multipart.max-request-size=220MB