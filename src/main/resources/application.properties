spring.application.name=football-api
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/football
spring.datasource.username=admin
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.root=INFO
logging.level.com.fscore.app=DEBUG

# Security
app.security.jwt-secret=football-api-change-this-secret-in-production-0123456789abcdef
app.security.jwt-expiration-ms=28800000
app.admin.email=admin@football.com
app.admin.password=admin123
app.admin.name=Administrator